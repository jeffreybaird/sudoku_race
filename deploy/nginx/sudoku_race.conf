# Nginx site for Sudoku Race — shares the droplet's existing Nginx with
# residency-schedule. Sudoku must use a DISTINCT subdomain (not the residency
# one) and proxies to the Docker app published on 127.0.0.1:4001.
#
# HTTP-only by design: `certbot --nginx` adds the `listen 443 ssl` block, the
# cert paths, and the 80→443 redirect. Starting with the 443 block here would
# fail `nginx -t` before the cert exists (chicken-and-egg).
#
# Server setup (run once, as root, alongside the residency-schedule config):
#
#   cp deploy/nginx/sudoku_race.conf /etc/nginx/sites-available/sudoku_race
#   # edit YOUR_DOMAIN below to your real subdomain, e.g. sudoku.example.com
#   ln -s /etc/nginx/sites-available/sudoku_race /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default   # if the "Welcome to nginx" page shows
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d YOUR_DOMAIN           # issues the cert + adds the 443 block
#
# Do NOT add `default_server` here — residency-schedule already owns 80/443;
# Nginx routes to this block by server_name.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    location / {
        proxy_pass         http://127.0.0.1:4001;
        proxy_http_version 1.1;
        # Required for Phoenix LiveView WebSocket upgrades.
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
