# Nginx site for Sudoku Race — shares the droplet's existing Nginx with
# residency-schedule. Sudoku must use a DISTINCT subdomain (not the residency
# one) and proxies to the Docker app published on 127.0.0.1:4001.
#
# Server setup (run once, as root, alongside the residency-schedule config):
#
#   cp deploy/nginx/sudoku_race.conf /etc/nginx/sites-available/sudoku_race
#   # edit YOUR_DOMAIN below to your real subdomain, e.g. sudoku.example.com
#   ln -s /etc/nginx/sites-available/sudoku_race /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d YOUR_DOMAIN     # issues + wires the TLS cert
#
# Do NOT add a `listen 80/443 default_server` here — residency-schedule's
# block already terminates TLS on those ports; Nginx routes by server_name.

server {
    listen 80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name YOUR_DOMAIN;

    # Certbot fills these in when you run `certbot --nginx -d YOUR_DOMAIN`.
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    location / {
        proxy_pass         http://127.0.0.1:4001;
        proxy_http_version 1.1;
        # Required for Phoenix LiveView WebSocket upgrades.
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
