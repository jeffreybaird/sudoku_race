version: "3.9"

# Single-host deployment: Phoenix app + Postgres.
#
# TLS + reverse proxy are handled by the HOST's existing Nginx (shared with
# other apps on the same droplet — see DEPLOY.md). This stack does NOT bind
# host ports 80/443; it publishes the app only on 127.0.0.1:4001 for Nginx to
# proxy to. This is what lets sudoku_race coexist with residency-schedule
# (whose Nginx already owns 80/443 and whose app owns localhost:4000).
#
# Required environment variables (set in .env or via your CI/deploy tooling):
#   DATABASE_URL     — ecto://postgres:PASSWORD@db/sudoku_race_prod
#   SECRET_KEY_BASE  — generate with: mix phx.gen.secret
#   PHX_HOST         — public hostname, e.g. sudoku.example.com
#
# Optional:
#   POOL_SIZE        — Ecto pool size (default 10)
#   PORT             — internal Phoenix port (default 4000; Nginx proxies to
#                      127.0.0.1:4001 → this container's 4000)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: sudoku_race_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # APP_IMAGE points at the Docker Hub image the CI build pushed, e.g.
    # docker.io/<dockerhub-user>/sudoku_race:latest. Compose reads it from
    # /opt/sudoku_race/.env so `docker compose pull` fetches the right image.
    image: ${APP_IMAGE:-sudoku_race:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-ecto://postgres:postgres@db/sudoku_race_prod}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      PHX_HOST: ${PHX_HOST:?PHX_HOST is required}
      PHX_SERVER: "true"
      PORT: "4000"
      POOL_SIZE: ${POOL_SIZE:-10}
    # Run migrations before starting the server
    command: >
      sh -c "bin/sudoku_race eval 'SudokuRace.Release.migrate()' && bin/sudoku_race start"
    # Bind to loopback only — the host's Nginx proxies to this. Never publish
    # 0.0.0.0:4001, and never reuse 4000 (residency-schedule's app owns it).
    ports:
      - "127.0.0.1:4001:4000"

volumes:
  postgres_data:
